[package]
name = "dcpr-agent"
description = "A typed tool contract and a hookable tool-calling loop for LLM agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["llm", "agents", "tool-calling", "json-schema"]
categories = ["asynchronous"]

[features]
# Bridge tools to and from MCP servers through rmcp.
mcp = ["dep:rmcp"]

[dependencies]
async-trait.workspace = true
dcpr-llm.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rmcp = { workspace = true, features = ["client", "server"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { workspace = true, features = ["client", "server", "transport-child-process"] }

[[test]]
name = "mcp"
required-features = ["mcp"]

[package.metadata.docs.rs]
all-features = true
