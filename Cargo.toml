[workspace]
resolver = "3"
members = ["crates/dcpr-llm", "crates/dcpr-agent"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["D C P Revere <dcprevere@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DCPRevere/dcpr-ai-rs"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
rand = "0.10"
rmcp = { version = "3.8", default-features = false }
async-openai = { version = "0.43", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tracing = "0.1"
wiremock = "0.6"
dcpr-llm = { path = "crates/dcpr-llm", version = "0.2.0" }
